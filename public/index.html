<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Fun List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <span class="brand-icon">✨</span>
        <span class="brand-name">The Fun List</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab active" data-view="home" role="tab" aria-selected="true">Home</button>
        <button class="tab" data-view="list" role="tab" aria-selected="false">My List</button>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle theme">🌙</button>
        <button class="btn btn-primary" id="add-item-btn">+ Add Item</button>
      </div>
    </header>

    <main class="content">
      <!-- HOME VIEW -->
      <section id="view-home" class="view">
        <div class="hero">
          <h1>Your Top 3</h1>
          <p class="subtitle">The things you want most, right now.</p>
        </div>

        <div id="top3-grid" class="top3-grid"></div>

        <div id="stats-bar" class="stats-bar glass"></div>
      </section>

      <!-- LIST VIEW -->
      <section id="view-list" class="view hidden">
        <div class="list-header">
          <h1>My List</h1>
          <p class="subtitle">Drag items to reprioritize. Highest priority sits on top.</p>
        </div>

        <div class="list-toolbar glass">
          <input type="search" id="search-input" placeholder="Search items…" />
          <select id="category-filter">
            <option value="">All categories</option>
          </select>
        </div>

        <div id="active-list" class="item-list"></div>

        <div class="purchased-section">
          <button id="purchased-toggle" class="purchased-toggle-btn">
            <span id="purchased-caret">▸</span> Purchased / Acquired <span id="purchased-count" class="pill">0</span>
          </button>
          <div id="purchased-list" class="item-list hidden"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Add Item</h2>
      <form id="item-form">
        <input type="hidden" id="item-id" />
        <label>
          Name <span class="req">*</span>
          <input type="text" id="field-name" required maxlength="120" placeholder="e.g. Sony WH-1000XM6" />
        </label>
        <label>
          Price
          <input type="number" id="field-price" min="0" step="0.01" placeholder="0.00" />
        </label>
        <label>
          Category
          <input type="text" id="field-category" maxlength="60" placeholder="e.g. Tech, Investing, Hobby" list="category-suggestions" />
          <datalist id="category-suggestions"></datalist>
        </label>
        <label>
          Notes
          <textarea id="field-notes" maxlength="500" rows="3" placeholder="Why do you want it? Model, link, size…"></textarea>
        </label>
        <div class="form-error hidden" id="form-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIRM DELETE MODAL -->
  <div id="confirm-overlay" class="modal-overlay hidden">
    <div class="modal modal-small glass" role="dialog" aria-modal="true">
      <h2>Delete this item?</h2>
      <p id="confirm-text" class="confirm-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
